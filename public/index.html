<section class="view on" id="v-pocetna">
  <header class="hero has" id="hero">
    <svg class="scene" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa9cf"/><stop offset="1" stop-color="#d6e6ea"/></linearGradient><linearGradient id="se" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2487a0"/><stop offset="1" stop-color="#0b3c52"/></linearGradient></defs>
      <rect width="400" height="520" fill="url(#sk)"/>
      <polygon points="0,240 60,190 120,220 190,150 260,205 330,165 400,220 400,330 0,330" fill="#6d8ca2"/>
      <polygon points="0,290 90,220 170,280 250,230 340,290 400,260 400,360 0,360" fill="#3f6479"/>
      <rect y="330" width="400" height="190" fill="url(#se)"/>
      <rect x="10" y="328" width="34" height="24" fill="#e9d2b0"/><polygon points="8,328 27,316 46,328" fill="#c9683a"/>

    </svg>
    <div class="brand"><img src="/icons/icon-192.png" width="32" height="32" alt="" class="blogo">Montepalm</div>
    <button class="lang" id="lbtn" type="button" aria-label="Jezik" aria-haspopup="true" aria-expanded="false"><span class="on">SR</span><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg></button>
    <button class="bell" id="nbtn" type="button" aria-haspopup="dialog"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg><span class="badge" id="nbd" hidden></span></button>
    <div class="lmenu" id="lmenu" hidden></div>
    <button class="photo" id="pbtn" type="button" aria-label="Dodaj fotografiju" title="Dodaj fotografiju" data-i18n-aria="addPhoto" data-i18n-title="addPhoto"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg></button>
    <input type="file" id="pfile" accept="image/*" hidden>
    <div class="hin"><h1 data-i18n-html="heroTitle">Crna Gora<br>na dlanu</h1><p data-i18n="heroSub">Šta se dešava, gdje i kada. Izaberi mjesto i period.</p></div>
  </header>

  <form class="search" id="sf" autocomplete="off">
    <div class="pw">
      <div class="fld">
        <svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg>
        <div class="fb"><label for="hp" data-i18n="where">Gdje</label><input id="hp" data-i18n-ph="wherePh" placeholder="Herceg Novi, Kotor, Žabljak…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="hs"></div>
        <button class="clr" type="button" hidden aria-label="Obriši mjesto" data-i18n-aria="clearPlace"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
      <div class="sug" id="hs" role="listbox" hidden></div>
    </div>
    <div class="r2">
      <button class="fld df" type="button" id="hf" data-pair="h" data-f="f"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span class="fb"><span class="lbl" data-i18n="from">Od</span><span class="v e">Izaberi datum</span></span></button>
      <button class="fld df" type="button" id="ht" data-pair="h" data-f="t"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span class="fb"><span class="lbl" data-i18n="to">Do</span><span class="v e">Izaberi datum</span></span></button>
    </div>
    <button class="btn p full" id="hgo" type="button"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span data-i18n="search">Pretraži</span></button>
  </form>

  <div class="wrap">
    <div class="hd"><h2 data-i18n="soon">Uskoro</h2><button class="lnk" id="allev" type="button"><span data-i18n="allEvents">Svi događaji</span><svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button></div>
    <div class="rail" id="rail"></div>
    <section id="nsec" hidden>
      <div class="hd"><h2 data-i18n="nearTitle">Danas i u blizini</h2></div>
      <div class="chips" id="nchips" role="group" aria-label="Danas i u blizini">
        <button class="chip" type="button" data-n="today" aria-pressed="true"><span data-i18n="nToday">Danas</span></button>
        <button class="chip" type="button" data-n="weekend" aria-pressed="false"><span data-i18n="nWeekend">Vikend</span></button>
        <button class="chip" type="button" data-n="near" aria-pressed="false"><span data-i18n="nNear">Blizu mene</span></button>
      </div>
      <div class="rail" id="nrail"></div>
    </section>
    <div class="hd"><h2 data-i18n="whatToday">Šta želiš danas?</h2></div>
    <div class="tiles" id="tiles"></div>
  </div>
</section>

<section class="view" id="v-istrazi">
  <div class="wrap top">
    <h1 data-i18n="explore">Istraži</h1>
    <div class="search flat">
      <div class="pw">
        <div class="fld">
          <svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg>
          <div class="fb"><label for="p" data-i18n="place">Mjesto</label><input id="p" data-i18n-ph="placePh" placeholder="Cijela Crna Gora" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="xs"></div>
          <button class="clr" type="button" hidden aria-label="Obriši mjesto" data-i18n-aria="clearPlace"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
        <div class="sug" id="xs" role="listbox" hidden></div>
      </div>
      <div class="r2">
        <button class="fld df" type="button" id="xf" data-pair="x" data-f="f"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span class="fb"><span class="lbl" data-i18n="from">Od</span><span class="v e">Izaberi datum</span></span></button>
        <button class="fld df" type="button" id="xt" data-pair="x" data-f="t"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span class="fb"><span class="lbl" data-i18n="to">Do</span><span class="v e">Izaberi datum</span></span></button>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Kategorija" data-i18n-aria="category"></div>
    <div class="count" id="count" aria-live="polite"></div>
    <div id="out"></div>
  </div>
</section>

<section class="view" id="v-plan">
  <div class="wrap top">
    <h1 data-i18n="myTrip">Moj put</h1>
    <div id="pout"></div>
    <section class="pushbox" id="pushbox" hidden></section>
    <button class="btn s full" id="share" type="button"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg><span data-i18n="sharePlan">Podijeli plan</span></button>
    <button class="btn s full" id="ics" type="button" hidden style="margin-top:10px"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span data-i18n="addCal">Dodaj u kalendar</span></button>
    <div class="m" id="sh" role="status" style="margin-top:8px"></div>
  </div>
</section>

<section class="view" id="v-korisno">
  <div class="wrap top">
    <h1 data-i18n="useful">Korisno</h1>
    <p class="sub" data-i18n="usefulSub">Brojevi, prevoz, novac i običaji na jednom mjestu.</p>
    <div id="kout"></div>
  </div>
</section>

<section class="view" id="v-detalj">
  <div id="dt" aria-live="polite"></div>
</section>

<nav class="tabs" aria-label="Glavna navigacija" data-i18n-aria="mainNav">
  <a href="#pocetna"><span class="ti"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg></span><span data-i18n="home">Početna</span></a>
  <a href="#istrazi"><span class="ti"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></span><span data-i18n="explore">Istraži</span></a>
  <a href="#plan"><span class="ti"><svg class="ic" aria-hidden="true"><use href="#i-route"/></svg><span class="badge" id="pb" hidden></span></span><span data-i18n="myTrip">Moj put</span></a>
  <a href="#korisno"><span class="ti"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg></span><span data-i18n="useful">Korisno</span></a>
</nav>

<!-- kalendar -->
<div class="sheet" id="cal" hidden>
  <div class="scrim" data-x></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cal-t">
    <div class="grab" aria-hidden="true"></div>
    <div class="ph"><h2 id="cal-t" data-i18n="pickPeriod">Izaberi period</h2><button class="ib" type="button" data-x aria-label="Zatvori" data-i18n-aria="close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="presets" id="presets">
      <button type="button" class="chip" data-pre="we" data-i18n="weekend">Vikend</button>
      <button type="button" class="chip" data-pre="w" data-i18n="days7">7 dana</button>
      <button type="button" class="chip" data-pre="m" data-i18n="thisMonth">Ovaj mjesec</button>
    </div>
    <div class="mn">
      <button class="ib" type="button" id="prev" aria-label="Prethodni mjesec" data-i18n-aria="prevMonth"><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></button>
      <div class="mt" id="mt" aria-live="polite"></div>
      <button class="ib" type="button" id="next" aria-label="Sljedeći mjesec" data-i18n-aria="nextMonth"><svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button>
    </div>
    <div class="wd" aria-hidden="true"><span>Pon</span><span>Uto</span><span>Sri</span><span>Čet</span><span>Pet</span><span>Sub</span><span>Ned</span></div>
    <div class="days" id="days"></div>
    <div class="pf">
      <div class="sum" id="sum"></div>
      <div class="acts"><button class="btn g" type="button" id="cclr" data-i18n="clear">Očisti</button><button class="btn p" type="button" id="capp" data-i18n="apply">Primijeni</button></div>
    </div>
  </div>
</div>

<!-- obavještenja (sanduče) -->
<div class="sheet" id="inbox" hidden>
  <div class="scrim" data-x></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="inb-t">
    <div class="grab" aria-hidden="true"></div>
    <div class="ph"><h2 id="inb-t"></h2><button class="ib" type="button" data-x id="inbx"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div id="inbl" class="inbl"></div>
    <button class="btn g full" type="button" id="inbc" hidden></button>
  </div>
</div>

<!-- galerija preko cijelog ekrana -->
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Galerija fotografija" data-i18n-aria="gallery">
  <button class="ib lbx" type="button" id="lbx" aria-label="Zatvori" data-i18n-aria="close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  <button class="ib lbn prev" type="button" id="lbp" aria-label="Prethodna fotografija" data-i18n-aria="prevPhoto"><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></button>
  <div class="lbm" id="lbm"></div>
  <button class="ib lbn next" type="button" id="lbn" aria-label="Sljedeća fotografija" data-i18n-aria="nextPhoto"><svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button>
  <div class="lbc" id="lbc"></div>
</div>
