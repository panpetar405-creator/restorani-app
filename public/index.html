<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montepalm: šta ima u Crnoj Gori</title>
<meta name="description" content="Izaberi mjesto i period u Crnoj Gori i vidi događaje, plaže, kulturu i gastronomiju.">
<meta name="theme-color" content="#10303f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Jedan set ikonica: linija 1.8, zaobljeni krajevi -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a2 2 0 0 1 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M14 5v3M14 11v2M14 16v3"/></symbol>
  <symbol id="i-umbrella" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9z"/><path d="M12 12v7a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-fork" viewBox="0 0 24 24"><path d="M6 3v6a2 2 0 0 0 4 0V3M8 11v10M18 21V3c-2.5 1.5-4 4.5-4 8h4"/></symbol>
  <symbol id="i-columns" viewBox="0 0 24 24"><path d="M3 9l9-5 9 5M5 11v6M9.5 11v6M14.5 11v6M19 11v6M3 20h18"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.1"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2.2 2.2L15 10"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<section class="view on" id="v-pocetna">
  <header class="hero" id="hero">
    <svg class="scene" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa9cf"/><stop offset="1" stop-color="#d6e6ea"/></linearGradient><linearGradient id="se" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2487a0"/><stop offset="1" stop-color="#0b3c52"/></linearGradient></defs>
      <rect width="400" height="520" fill="url(#sk)"/>
      <polygon points="0,240 60,190 120,220 190,150 260,205 330,165 400,220 400,330 0,330" fill="#6d8ca2"/>
      <polygon points="0,290 90,220 170,280 250,230 340,290 400,260 400,360 0,360" fill="#3f6479"/>
      <rect y="330" width="400" height="190" fill="url(#se)"/>
      <rect x="10" y="328" width="34" height="24" fill="#e9d2b0"/><polygon points="8,328 27,316 46,328" fill="#c9683a"/>
      <rect x="80" y="326" width="36" height="28" fill="#e9d2b0"/><polygon points="78,326 98,312 118,326" fill="#c9683a"/>
      <rect x="302" y="290" width="34" height="140" fill="#bda98c"/><ellipse cx="319" cy="256" rx="14" ry="12" fill="#a8896a"/><rect x="306" y="256" width="26" height="36" fill="#c8b698"/>
    </svg>
    <div class="brand"><svg width="30" height="30" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#f2b01e"/><polygon points="6,28 17,14 23,22 29,12 38,28" fill="#0f6f7c"/><path d="M6 31q4-4 8 0t8 0 8 0 8 0v6H6z" fill="#10303f"/></svg>Montepalm</div>
    <button class="photo" id="pbtn" type="button" aria-label="Dodaj fotografiju" title="Dodaj fotografiju"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg></button>
    <input type="file" id="pfile" accept="image/*" hidden>
    <div class="hin"><h1>Crna Gora<br>na dlanu</h1><p>Šta se dešava, gdje i kada. Izaberi mjesto i period.</p></div>
  </header>

  <form class="search" id="sf" autocomplete="off">
    <div class="pw">
      <div class="fld">
        <svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg>
        <div class="fb"><label for="hp">Gdje</label><input id="hp" placeholder="Herceg Novi, Kotor, Žabljak…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="hs"></div>
        <button class="clr" type="button" hidden aria-label="Obriši mjesto"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
      <div class="sug" id="hs" role="listbox" hidden></div>
    </div>
    <div class="r2">
      <button class="fld df" type="button" id="hf" data-pair="h" data-f="f"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span class="fb"><span class="lb">Od</span><span class="v e">Izaberi datum</span></span></button>
      <button class="fld df" type="button" id="ht" data-pair="h" data-f="t"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span class="fb"><span class="lb">Do</span><span class="v e">Izaberi datum</span></span></button>
    </div>
    <button class="btn p full" id="hgo" type="button"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>Pretraži</button>
  </form>

  <div class="wrap">
    <div class="hd"><h2>Uskoro</h2><button class="lnk" id="allev" type="button">Svi događaji<svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button></div>
    <div class="rail" id="rail"></div>
    <div class="hd"><h2>Šta želiš danas?</h2></div>
    <div class="tiles" id="tiles"></div>
  </div>
</section>

<section class="view" id="v-istrazi">
  <div class="wrap top">
    <h1>Istraži</h1>
    <div class="search flat">
      <div class="pw">
        <div class="fld">
          <svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg>
          <div class="fb"><label for="p">Mjesto</label><input id="p" placeholder="Cijela Crna Gora" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="xs"></div>
          <button class="clr" type="button" hidden aria-label="Obriši mjesto"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
        <div class="sug" id="xs" role="listbox" hidden></div>
      </div>
      <div class="r2">
        <button class="fld df" type="button" id="xf" data-pair="x" data-f="f"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span class="fb"><span class="lb">Od</span><span class="v e">Izaberi datum</span></span></button>
        <button class="fld df" type="button" id="xt" data-pair="x" data-f="t"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span class="fb"><span class="lb">Do</span><span class="v e">Izaberi datum</span></span></button>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Kategorija"></div>
    <div class="count" id="count" aria-live="polite"></div>
    <div id="out"></div>
  </div>
</section>

<section class="view" id="v-plan">
  <div class="wrap top">
    <h1>Moj put</h1>
    <div id="pout"></div>
    <button class="btn s full" id="share" type="button"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg>Podijeli plan</button>
    <div class="m" id="sh" role="status" style="margin-top:8px"></div>
  </div>
</section>

<nav class="tabs" aria-label="Glavna navigacija">
  <a href="#pocetna"><span class="ti"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg></span>Početna</a>
  <a href="#istrazi"><span class="ti"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></span>Istraži</a>
  <a href="#plan"><span class="ti"><svg class="ic" aria-hidden="true"><use href="#i-route"/></svg><span class="badge" id="pb" hidden></span></span>Moj put</a>
</nav>

<!-- kalendar -->
<div class="sheet" id="cal" hidden>
  <div class="scrim" data-x></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="cal-t">
    <div class="grab" aria-hidden="true"></div>
    <div class="ph"><h2 id="cal-t">Izaberi period</h2><button class="ib" type="button" data-x aria-label="Zatvori"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="presets" id="presets">
      <button type="button" class="chip" data-pre="we">Vikend</button>
      <button type="button" class="chip" data-pre="w">7 dana</button>
      <button type="button" class="chip" data-pre="m">Ovaj mjesec</button>
    </div>
    <div class="mn">
      <button class="ib" type="button" id="prev" aria-label="Prethodni mjesec"><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></button>
      <div class="mt" id="mt" aria-live="polite"></div>
      <button class="ib" type="button" id="next" aria-label="Sljedeći mjesec"><svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button>
    </div>
    <div class="wd" aria-hidden="true"><span>Pon</span><span>Uto</span><span>Sri</span><span>Čet</span><span>Pet</span><span>Sub</span><span>Ned</span></div>
    <div class="days" id="days"></div>
    <div class="pf">
      <div class="sum" id="sum"></div>
      <div class="acts"><button class="btn g" type="button" id="cclr">Očisti</button><button class="btn p" type="button" id="capp">Primijeni</button></div>
    </div>
  </div>
</div>

<noscript>Za korištenje aplikacije Montepalm potreban je JavaScript.</noscript>
<script src="/app.js" defer></script>
</body>
</html>
